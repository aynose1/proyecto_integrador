services:
  haproxy:
    build:
      context: ./haproxy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Local (misma PC, Docker Desktop): host.docker.internal
      # Producción (VM separada en la nube): la IP privada real de la VM
      # que corre compose.private.yaml.
      PRIVATE_HOST_IP: ${PRIVATE_HOST_IP:-host.docker.internal}
    volumes:
      - ./haproxy/certs:/usr/local/etc/haproxy/certs:ro
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8404:8404"
      - "8405:8405"
    depends_on:
      - grafana
    networks:
      - edge_network

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: grafana.lab.local
      # Local: cambia a http://localhost/grafana/ si accedes por HTTP en
      # pruebas. Producción: la IP/dominio público real de esta VM.
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST_IP:-192.168.10.102}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - edge_network

networks:
  edge_network:

volumes:
  grafana_data:
