{% extends "base.html" %}
{% block title %}Registro — {{ app_name }}{% endblock %}

{% block auth_content %}
<div class="auth-card card shadow">
  <div class="card-body p-4">
    <div class="auth-header text-center">
      <img src="{{ url_for('static', filename='img/pi_logo.png') }}" alt="{{ app_name }}" class="auth-header__logo">
      <div class="auth-header__name">{{ app_name }}</div>
      <div class="auth-header__tagline">Sistema de gestión de recolección de residuos</div>
    </div>

    <h1 class="h4 mb-1">Registro de administrador</h1>
    <p class="text-muted mb-4">Crea tu cuenta para gestionar el sistema.</p>

    <form method="post" action="{{ url_for('auth.register') }}">
      <div class="mb-3">
        <label class="form-label" for="codigo_usuario">Código de usuario</label>
        <input type="text" class="form-control" id="codigo_usuario" name="codigo_usuario" required maxlength="20" autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label" for="nombre">Nombre</label>
        <input type="text" class="form-control" id="nombre" name="nombre" required maxlength="100">
      </div>
      <div class="mb-3">
        <label class="form-label" for="apellido_paterno">Apellido paterno</label>
        <input type="text" class="form-control" id="apellido_paterno" name="apellido_paterno" required maxlength="100">
      </div>
      <div class="mb-3">
        <label class="form-label" for="apellido_materno">Apellido materno <span class="text-muted">(opcional)</span></label>
        <input type="text" class="form-control" id="apellido_materno" name="apellido_materno" maxlength="100">
      </div>
      <div class="mb-3">
        <label class="form-label" for="contrasena">Contraseña</label>
        <div class="input-group">
          <input type="password" class="form-control" id="contrasena" name="contrasena" required minlength="8">
          <button type="button" class="btn btn-outline-secondary" onclick="toggleVerContrasena('contrasena', this)" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
        <div class="password-requisitos small" id="requisitos_contrasena"></div>
      </div>
      <div class="mb-4">
        <label class="form-label" for="contrasena_confirm">Confirmar contraseña</label>
        <div class="input-group">
          <input type="password" class="form-control" id="contrasena_confirm" name="contrasena_confirm" required minlength="8">
          <button type="button" class="btn btn-outline-secondary" onclick="toggleVerContrasena('contrasena_confirm', this)" tabindex="-1">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
    </form>

    <p class="text-center text-muted mt-4 mb-0 small">
      ¿Ya tienes cuenta?
      <a class="auth-link" href="{{ url_for('auth.login') }}">Inicia sesión</a>
    </p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/password-policy.js') }}"></script>
<script>
  function toggleVerContrasena(inputId, boton) {
    const input = document.getElementById(inputId);
    const icono = boton.querySelector('i');
    const verAhora = input.type === 'password';
    input.type = verAhora ? 'text' : 'password';
    icono.classList.toggle('bi-eye', !verAhora);
    icono.classList.toggle('bi-eye-slash', verAhora);
  }

  montarChecklistPassword('contrasena', 'requisitos_contrasena', false);

  const passInput = document.getElementById('contrasena');
  const confirmInput = document.getElementById('contrasena_confirm');
  function validarCoincidenciaRegistro() {
    confirmInput.setCustomValidity(passInput.value !== confirmInput.value ? 'Las contraseñas no coinciden.' : '');
  }
  passInput.addEventListener('input', validarCoincidenciaRegistro);
  confirmInput.addEventListener('input', validarCoincidenciaRegistro);
</script>
{% endblock %}
